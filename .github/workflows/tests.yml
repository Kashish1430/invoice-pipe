name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # No AWS credentials configured on purpose -- the suite never calls
        # real AWS: moto mocks S3/DynamoDB, hand-written fakes script
        # Textract/Bedrock's async and tool-use contracts. See README.md
        # "Testing" for what each layer actually covers.
        run: pytest -q
