[project]
name = "invoice-pipe"
version = "0.1.0"
description = "Daily-batch, multi-vendor PDF invoice extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
]

[project.scripts]
invoice-pipe = "src.pipeline.run_batch:main"
invoice-pipe-stats = "src.stats.batch_stats:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]
